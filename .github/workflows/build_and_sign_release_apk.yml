{
  "name": "Kiwi: Build and sign release apk",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "prepareRelease": {
          "description": "Create a draft release in Google Play Store",
          "required": true,
          "default": "no"
        },
        "announceOnMessengers": {
          "description": "Announce new release on Discord and Telegram channels",
          "required": true,
          "default": "yes"
        }
      }
    }
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "platform": [
            "arm",
            "arm64",
            "x86",
            "x64"
          ]
        }
      },
      "steps": [
        {
          "name": "Initializing build",
          "run": "echo Initializing build for platform ${{ matrix.platform }}"
        },
        {
          "name": "Updating APT repository",
          "run": "sudo apt-get update"
        },
        {
          "name": "Installing rclone",
          "run": "sudo -v ; wget https://downloads.rclone.org/v1.63.1/rclone-v1.63.1-linux-amd64.deb && sudo dpkg -i rclone-v1.63.1-linux-amd64.deb"
        },
        {
          "name": "Installing Python and OpenJDK",
          "run": "sudo apt-get install -y 2to3 python3-minimal python3 dh-python python-is-python3 openjdk-8-jdk-headless ccache jq"
        },
        {
          "name": "Reclaiming disk space on / by disabling swap partition",
          "run": "sudo swapoff -av\nsudo rm -f /swapfile\n"
        },
        {
          "name": "Reclaiming disk space on / by removing .NET framework",
          "run": "sudo rm -rf /usr/share/dotnet"
        },
        {
          "name": "Checking-out source-code in $GITHUB_WORKSPACE",
          "uses": "actions/checkout@v2"
        },
        {
          "name": "Creating secondary disk folder on /dev/disk/azure/resource-part1 (SSD)",
          "run": "sudo mkdir -p /extended_data\nsudo chown -R runner:docker /extended_data\n"
        },
        {
          "name": "On SSD - Creating symlink on /dev/disk/azure/root-part1 pointing to /dev/disk/azure/resource-part1",
          "run": "sudo ln -s /extended_data /mnt/secondary_disk\nsudo ln -s /mnt/secondary_disk $GITHUB_WORKSPACE/\n"
        },
        {
          "name": "Creating output folder",
          "run": "mkdir -p secondary_disk/out/android_${{ matrix.platform }}"
        },
        {
          "name": "Generating one-time APK signature key",
          "run": "keytool -genkey -v -keystore keystore.jks -alias dev -keyalg RSA -keysize 2048 -validity 10000 -storepass public_password -keypass public_password -dname \"cn=Kiwi Browser (unverified), ou=Actions, o=Kiwi Browser, c=GitHub\""
        },
        {
          "name": "Copying args.gn to target folder",
          "run": "cat .build/android_arm/args.gn | sed \"s#target_cpu = \\\"arm\\\"#target_cpu = \\\"${{ matrix.platform }}\\\"#\" | sed \"s#android_default_version_name = \\\"Git\\\"#android_default_version_name = \\\"Git$(date '+%y%m%d')Gen${{ github.run_id }}\\\"#\" > secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Creating rclone config",
          "run": "mkdir -p $HOME/.config/rclone/\necho '[cache]' > $HOME/.config/rclone/rclone.conf\necho 'type = sftp' >> $HOME/.config/rclone/rclone.conf\necho 'host = ${{ secrets.STORAGE_HOST }}' >> $HOME/.config/rclone/rclone.conf\necho 'user = storage' >> $HOME/.config/rclone/rclone.conf\necho 'key_pem = ${{ secrets.STORAGE_KEY }}' >> $HOME/.config/rclone/rclone.conf\n"
        },
        {
          "name": "Modifying args.gn (arm)",
          "if": "matrix.platform == 'arm'",
          "run": "sed -i \"s#android_default_version_code = \\\"1\\\"#android_default_version_code = \\\"$(date '+%y%m%d')1\\\"#\" secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Modifying args.gn (arm64)",
          "if": "matrix.platform == 'arm64'",
          "run": "sed -i \"s#android_default_version_code = \\\"1\\\"#android_default_version_code = \\\"$(date '+%y%m%d')2\\\"#\" secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Modifying args.gn (x86)",
          "if": "matrix.platform == 'x86'",
          "run": "sed -i \"s#android_default_version_code = \\\"1\\\"#android_default_version_code = \\\"$(date '+%y%m%d')3\\\"#\" secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Modifying args.gn (x64)",
          "if": "matrix.platform == 'x64'",
          "run": "sed -i \"s#android_default_version_code = \\\"1\\\"#android_default_version_code = \\\"$(date '+%y%m%d')4\\\"#\" secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Displaying args.gn",
          "run": "cat secondary_disk/out/android_${{ matrix.platform }}/args.gn"
        },
        {
          "name": "Checking available disk-space",
          "run": "df -h"
        },
        {
          "name": "Uploading args.gn",
          "run": "rclone copy --transfers=128 --retries=10 secondary_disk/out/android_${{ matrix.platform }}/args.gn cache:beasonxu-next-builds-${{ matrix.platform }}/"
        },
        {
          "name": "Calling buildbot",
          "if": false,
          "run": "curl ipinfo.io"
        },
        {
          "name": "Downloading binary objects cache to $HOME/cache",
          "run": "rclone copy --transfers=128 --retries=10 cache:beasonxu-next-builds-${{ matrix.platform }}/ $HOME/beasonxu-next-builds-${{ matrix.platform }}"
        },
        {
          "name": "Transferring build to the standard Kiwi Browser run ID",
          "run": "rclone copy --transfers=128 --retries=10 cache:beasonxu-next-builds-${{ matrix.platform }}/ cache:beasonxu-builds/${{ github.run_id }}/${{ matrix.platform }}"
        },
        {
          "name": "Listing files",
          "run": "echo $HOME\nls -la $HOME/beasonxu-next-builds-${{ matrix.platform }}\n"
        },
        {
          "name": "Uploading APK",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "apk-${{ matrix.platform }}",
            "path": "/home/runner/beasonxu-next-builds-${{ matrix.platform }}/"
          }
        }
      ]
    },
    "sign_and_upload": {
      "runs-on": "ubuntu-latest",
      "needs": "build",
      "steps": [
        {
          "name": "Installing rclone",
          "run": "curl --http1.1 https://rclone.org/install.sh | sudo bash"
        },
        {
          "name": "Creating rclone config",
          "run": "mkdir -p $HOME/.config/rclone/\necho '[cache]' > $HOME/.config/rclone/rclone.conf\necho 'type = sftp' >> $HOME/.config/rclone/rclone.conf\necho 'host = ${{ secrets.STORAGE_HOST }}' >> $HOME/.config/rclone/rclone.conf\necho 'user = storage' >> $HOME/.config/rclone/rclone.conf\necho 'key_pem = ${{ secrets.STORAGE_KEY }}' >> $HOME/.config/rclone/rclone.conf\n"
        },
        {
          "name": "Downloading artifact (arm)",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "apk-arm",
            "path": "apk-arm"
          }
        },
        {
          "name": "Downloading artifact (arm64)",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "apk-arm64",
            "path": "apk-arm64"
          }
        },
        {
          "name": "Downloading artifact (x86)",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "apk-x86",
            "path": "apk-x86"
          }
        },
        {
          "name": "Downloading artifact (x64)",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "apk-x64",
            "path": "apk-x64"
          }
        },
        {
          "name": "Listing files under $HOME",
          "run": "pwd\necho $HOME\nls -laR $HOME\n"
        },
        {
          "name": "Prepare release notes",
          "run": "cat ./apk-arm/last_commits.txt > release_notes.txt\ncat <<EOT >> release_notes.txt\n\nThis version will replace your currently installed Kiwi Browser (com.beasonxu.browser).\nIf you have important data, make sure to backup them or save them before upgrading to this version.\n\nThis release was automatically generated from GitHub ${{ github.ref }} in run ID ${{ github.run_id }}.\n\nSummary:\n  - To install / update Kiwi Browser, use \"com.beasonxu.browser-arm64-${{ github.run_id }}-github.apk\".\n  If it doesn't work, try again using \"com.beasonxu.browser-arm64-${{ github.run_id }}-playstore.apk\" (if it exists).\n\nDetailed information about the different files:\n  - \".map\" files are files that developers can use to investigate crashes (ProGuard mapping files), these files are not needed to run the browser and are for developers only.\n  - \".apk\" files are packages that you have to install to use Kiwi Browser.\n\nThe filenames are in the form \"[PACKAGE_NAME]-[ARCHITECTURE]-[BUILD_VERSION]-[SIGNATURE_TYPE].apk\"\n\nIf you want to keep the Play Store version installed, and still try the GitHub edition then you can install the APKs starting with \"com.beasonxu.browser.dev\" (you will keep all your Play Store bookmarks, settings and passwords, and the GitHub edition will be installed separately).\n\nBuild version:\n - Everytime a change is introduced in Kiwi Browser, a new build version is generated.\n\nArchitecture:\n  - \"-arm64\" is compatible with modern devices and offers the best performance.\n  - \"-arm\" is compatible with almost all devices and uses less memory.\n  - \"-x86\" and \"-x64\" builds are compatible with emulators and Intel compatible tablets.\n\nSignature type:\n  - On Android, applications have to be signed by a developer before they can be installed.\n\nKiwi has two types of builds:\n\nSigned by the developer:\n  - \"-github.apk\" are builds signed using the official developer key.\nA signed build is a build that comes straight from the GitHub official repository and is always the most updated.\n\nPlay Certified by Google:\n  - Once in a while, we send a \"-github.apk\" build to be reviewed and signed by Google.\nGoogle reviews the application, checks that the application is not malicious, adds the \"Google Play Certified\" badge, signs the file and this becomes \"-playstore.apk\".\n\nWe then distribute \"-playstore.apk\" on Google Play, XDA-Developers, Samsung and other app stores.\n \nThis process takes some time and is partially manual so not all GitHub builds have a \"-playstore.apk\".\n\nOn Android, you can install an update to an application only if it was signed by the same developer as the version that you currently have installed:\n  - You can install a \"-github.apk\" build on top of a \"-github.apk\" build, and a \"-playstore.apk\" build on top of a \"-playstore.apk\" build.\n  - You cannot install a \"-playstore.apk\" build on top of a \"-github.apk\" build.\n\nEssentially, if you downloaded Kiwi from an app store, you need to use the \"-playstore.apk\" files or uninstall the version of Kiwi you have and start using the \"-github.apk\" version.\nEOT\n"
        },
        {
          "name": "Creating release",
          "id": "create_release",
          "uses": "actions/create-release@v1.1.4",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "owner": "beasonxu",
            "repo": "src.next",
            "tag_name": "${{ github.run_id }}",
            "release_name": "Generation ${{ github.run_id }}",
            "draft": false,
            "prerelease": true,
            "body_path": "release_notes.txt"
          }
        },
        {
          "name": "Signing and uploading release to GitHub and send to the Play Store",
          "if": "${{ github.repository_owner == 'beasonxu' && contains(github.event.inputs.prepareRelease, 'yes') }}",
          "run": "curl 'https://${{ secrets.RELEASE_HOST }}/?run_id=${{ github.run_id }}&dk=${{ secrets.DEPLOY_KEY }}&publish=1&target=aab'\n"
        },
        {
          "name": "Downloading artifacts from storage",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "run": "rclone copy --transfers=128 --retries=100 cache:beasonxu-builds/${{ github.run_id }}/arm/ ./apk-arm \nrclone copy --transfers=128 --retries=100 cache:beasonxu-builds/${{ github.run_id }}/arm64/ ./apk-arm64\nrclone copy --transfers=128 --retries=100 cache:beasonxu-builds/${{ github.run_id }}/x86/ ./apk-x86\nrclone copy --transfers=128 --retries=100 cache:beasonxu-builds/${{ github.run_id }}/x64/ ./apk-x64\n"
        },
        {
          "name": "Uploading release asset (arm-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-arm/ChromePublic-DevSigned.apk",
            "asset_name": "com.beasonxu.browser-arm-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading release asset (arm64-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-arm64/ChromePublic-DevSigned.apk",
            "asset_name": "com.beasonxu.browser-arm64-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading release asset (x86-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-x86/ChromePublic-DevSigned.apk",
            "asset_name": "com.beasonxu.browser-x86-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading release asset (x64-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-x64/ChromePublic-DevSigned.apk",
            "asset_name": "com.beasonxu.browser-x64-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading dev asset (arm-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-arm/ChromePublic-Next-DevSigned.apk",
            "asset_name": "com.beasonxu.browser.dev-arm-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading dev asset (arm64-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-arm64/ChromePublic-Next-DevSigned.apk",
            "asset_name": "com.beasonxu.browser.dev-arm64-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading dev asset (x86-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-x86/ChromePublic-Next-DevSigned.apk",
            "asset_name": "com.beasonxu.browser.dev-x86-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        },
        {
          "name": "Uploading dev asset (x64-signed)",
          "if": "${{ github.repository_owner == 'beasonxu' }}",
          "uses": "actions/upload-release-asset@v1",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "with": {
            "upload_url": "${{ steps.create_release.outputs.upload_url }}",
            "asset_path": "./apk-x64/ChromePublic-Next-DevSigned.apk",
            "asset_name": "com.beasonxu.browser.dev-x64-${{ github.run_id }}-github.apk",
            "asset_content_type": "application/vnd.android.package-archive"
          }
        }
      ]
    }
  }
}
